<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐐υєєη 𝐇ɪʀᴜ 𝐌ᴅ 🍒🦋 — Pair Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09050d;
            --card-bg: rgba(22, 12, 32, 0.65);
            --card-border: rgba(255, 64, 129, 0.25);
            --primary: #ff2a70;
            --secondary: #b5179e;
            --accent: #ff758f;
            --glow: rgba(255, 42, 112, 0.35);
            --text-main: #fff0f5;
            --text-muted: #a88299;
            --success: #00f5d4;
            --error: #ff4d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', 'Noto Sans Sinhala', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Aurora Background */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.55;
            animation: floatOrb 12s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            top: -100px;
            left: -80px;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, var(--secondary), transparent 70%);
            bottom: -120px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, 45px) scale(1.12); }
        }

        /* Grid overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 42, 112, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 42, 112, 0.05) 1px, transparent 1px);
            background-size: 36px 36px;
            z-index: 0;
            pointer-events: none;
        }

        /* Floating Petals / Particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50% 0 50% 0;
            opacity: 0.4;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Main Container */
        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        /* Glass Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 34px 28px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(255, 42, 112, 0.12);
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top shimmering border line */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), var(--secondary), transparent);
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-25%); }
            100% { transform: translateX(25%); }
        }

        /* Header / Brand */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-ring {
            width: 74px;
            height: 74px;
            margin: 0 auto 14px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 2px;
            box-shadow: 0 0 28px var(--glow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #13081c;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: butterflyFloat 3s ease-in-out infinite;
        }

        @keyframes butterflyFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(4deg); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 42, 112, 0.12);
            border: 1px solid rgba(255, 42, 112, 0.3);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #ffb3c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Form Inputs */
        .input-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .phone-field {
            display: flex;
            align-items: center;
            background: rgba(9, 5, 13, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            transition: all 0.25s ease;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .phone-field:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 42, 112, 0.18);
        }

        .country-prefix {
            padding: 0 14px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
        }

        input[type="tel"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 1.05rem;
            padding: 0 16px;
            height: 52px;
            letter-spacing: 1.2px;
        }

        input[type="tel"]::placeholder {
            color: rgba(168, 130, 153, 0.5);
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0;
            font-size: 0.9rem;
        }

        /* Action Button */
        .generate-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px -5px var(--glow);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(255, 42, 112, 0.55);
        }

        .generate-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Spinner */
        .loader {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Result Area */
        .result-area {
            margin-top: 22px;
            display: none;
        }

        .result-area.active {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.94) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .code-card {
            background: rgba(9, 5, 13, 0.85);
            border: 1px solid rgba(255, 42, 112, 0.45);
            border-radius: 18px;
            padding: 22px 18px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 0 25px rgba(255, 42, 112, 0.1);
        }

        .code-title {
            font-size: 0.7rem;
            font-family: 'Space Mono', monospace;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .pair-code {
            font-family: 'Space Mono', monospace;
            font-size: 2.1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 5px;
            text-shadow: 0 0 20px var(--primary);
            margin: 6px 0 14px;
            user-select: all;
        }

        .copy-action {
            background: rgba(255, 42, 112, 0.15);
            border: 1px solid rgba(255, 42, 112, 0.4);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .copy-action:hover {
            background: var(--primary);
            color: #fff;
        }

        .copy-action.copied {
            background: var(--success);
            border-color: var(--success);
            color: #09050d;
        }

        /* Timer Bar */
        .timer-bar-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-top: 16px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            transition: width 1s linear;
        }

        /* Guide Box */
        .guide-box {
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.65;
        }

        .guide-box strong {
            color: var(--accent);
        }

        /* Error Box */
        .error-alert {
            background: rgba(255, 77, 109, 0.14);
            border: 1px solid var(--error);
            color: #ff8fa3;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 0.84rem;
            text-align: center;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .footer span {
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="wrapper">
        <div class="glass-card">
            <div class="header">
                <div class="avatar-ring">
                    <div class="avatar-inner">🦋</div>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span> SERVER ONLINE
                </div>
                <h1>𝐐υєєη 𝐇ɪʀᴜ 𝐌ᴅ 🍒🦋</h1>
                <p>Multi-Device WhatsApp Pairing System</p>
            </div>

            <label class="input-label" for="phoneInput">WhatsApp Phone Number</label>
            <div class="phone-field">
                <div class="country-prefix">🇱🇰 +</div>
                <input type="tel" id="phoneInput" placeholder="94 7X XXX XXXX" maxlength="15" autocomplete="off">
            </div>

            <button class="generate-btn" id="submitBtn" onclick="requestPairing()">
                <span id="btnLabel">✨ GENERATE PAIR CODE</span>
            </button>

            <div class="result-area" id="resultArea"></div>
        </div>

        <div class="footer">
            CRAFTED FOR <span>QUEEN HIRU MD</span> 🍒🦋
        </div>
    </div>

    <script>
        // Create floating cherry particles
        const particleContainer = document.getElementById('particles');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 8 + 7) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            p.style.width = p.style.height = (Math.random() * 5 + 4) + 'px';
            particleContainer.appendChild(p);
        }

        // Auto-convert 07... to 947...
        const phoneInput = document.getElementById('phoneInput');
        phoneInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val.startsWith('0') && val.length >= 2) {
                val = '94' + val.substring(1);
            }
            e.target.value = val;
        });

        // Allow Enter key
        phoneInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') requestPairing();
        });

        let timerInterval;

        async function requestPairing() {
            let number = phoneInput.value.replace(/[^0-9]/g, '');
            if (number.startsWith('0')) number = '94' + number.substring(1);

            const btn = document.getElementById('submitBtn');
            const btnLabel = document.getElementById('btnLabel');
            const resultArea = document.getElementById('resultArea');

            if (!number || number.length < 10) {
                resultArea.innerHTML = `<div class="error-alert">⚠️ කරුණාකර රටේ කේතය (94) සමඟ නිවැරදි WhatsApp අංකය ඇතුළත් කරන්න.</div>`;
                resultArea.classList.add('active');
                return;
            }

            btn.disabled = true;
            btnLabel.innerHTML = `<div class="loader"></div> CONNECTING TO SERVER...`;
            resultArea.classList.remove('active');
            clearInterval(timerInterval);

            try {
                // Tries /code first, falls back to /pair if needed
                let res = await fetch(`/code?number=${number}`);
                if (res.status === 404) {
                    res = await fetch(`/pair?number=${number}`);
                }

                const data = await res.json();

                if (data && data.code) {
                    const formattedCode = data.code.includes('-') 
                        ? data.code 
                        : data.code.slice(0, 4) + '-' + data.code.slice(4);

                    resultArea.innerHTML = `
                        <div class="code-card">
                            <div class="code-title">YOUR LINKING CODE</div>
                            <div class="pair-code">${formattedCode}</div>
                            <button class="copy-action" id="copyBtn" onclick="copyPairCode('${data.code}')">
                                📋 COPY CODE
                            </button>
                            <div class="timer-bar-wrap">
                                <div class="timer-bar" id="timerBar"></div>
                            </div>
                        </div>
                        <div class="guide-box">
                            1. ඔබේ <strong>WhatsApp</strong> විවෘත කර <strong>Linked Devices</strong> වෙත යන්න.<br>
                            2. <strong>Link a Device</strong> → <strong>Link with phone number instead</strong> තෝරන්න.<br>
                            3. ඉහත කේතය ඇතුළත් කර Bot සම්බන්ධ කරගන්න 🍒
                        </div>
                    `;
                    startCountdown(60);
                } else {
                    throw new Error(data.error || data.message || "Pairing code ලබා ගැනීමට නොහැකි විය.");
                }
            } catch (err) {
                resultArea.innerHTML = `<div class="error-alert">❌ දෝෂයකි: ${err.message || "Server සම්බන්ධතාවය බිඳ වැටී ඇත."}</div>`;
            } finally {
                btn.disabled = false;
                btnLabel.innerHTML = `✨ GENERATE PAIR CODE`;
                resultArea.classList.add('active');
            }
        }

        function startCountdown(seconds) {
            let remaining = seconds;
            const bar = document.getElementById('timerBar');
            timerInterval = setInterval(() => {
                remaining--;
                if (bar) bar.style.width = ((remaining / seconds) * 100) + '%';
                if (remaining <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        function copyPairCode(rawCode) {
            navigator.clipboard.writeText(rawCode);
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerHTML = `✅ COPIED!`;
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.innerHTML = `📋 COPY CODE`;
                copyBtn.classList.remove('copied');
            }, 2500);
        }
    </script>
</body>
</html>
