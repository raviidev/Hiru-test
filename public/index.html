<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐐υєєη 𝐇ɪʀᴜ 𝐌ᴅ 🍒🦋 — Pair</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f0a;
            --surface: #111811;
            --border: #1e2e1e;
            --green: #00e676;
            --green-dim: #00c853;
            --green-glow: rgba(0, 230, 118, 0.15);
            --green-glow-strong: rgba(0, 230, 118, 0.3);
            --text: #e8f5e9;
            --muted: #4a6a4a;
            --error: #ff5252;
            --error-glow: rgba(255, 82, 82, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.5;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--green);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--green-glow-strong);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 26px;
            height: 26px;
            fill: #0a0f0a;
        }

        .brand-text h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            opacity: 0.6;
        }

        .card-label {
            font-size: 0.7rem;
            font-family: 'Space Mono', monospace;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 14px;
        }

        .input-group:focus-within {
            border-color: var(--green);
            box-shadow: 0 0 0 3px var(--green-glow);
        }

        .input-prefix {
            padding: 0 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--muted);
            border-right: 1px solid var(--border);
            height: 48px;
            display: flex;
            align-items: center;
            white-space: nowrap;
            flex-shrink: 0;
        }

        input[type="tel"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            padding: 0 14px;
            height: 48px;
            letter-spacing: 1px;
        }

        input[type="tel"]::placeholder {
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0;
            font-size: 0.875rem;
        }

        .btn {
            width: 100%;
            height: 48px;
            background: var(--green);
            border: none;
            border-radius: 10px;
            color: #0a0f0a;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            box-shadow: 0 0 24px var(--green-glow-strong);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10,15,10,0.3);
            border-top-color: #0a0f0a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .result {
            margin-top: 20px;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .code-box {
            background: var(--bg);
            border: 1px solid var(--green);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 32px var(--green-glow);
        }

        .code-label {
            font-size: 0.65rem;
            font-family: 'Space Mono', monospace;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .code-value {
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--green);
            letter-spacing: 4px;
            text-shadow: 0 0 24px var(--green-glow-strong);
            word-break: break-all;
        }

        .copy-btn {
            margin-top: 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .copy-btn:hover, .copy-btn.copied {
            border-color: var(--green);
            color: var(--green);
        }

        .instructions {
            margin-top: 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }

        .instructions p {
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.7;
        }

        .instructions p span {
            color: var(--green);
            font-family: 'Space Mono', monospace;
        }

        .error-box {
            background: var(--error-glow);
            border: 1px solid var(--error);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 0.82rem;
            color: var(--error);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%        { opacity: 0.4; transform: scale(0.7); }
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/></svg>
            </div>
            <div class="brand-text">
                <h1>𝐐υєєη 𝐇ɪʀᴜ 𝐌ᴅ 🍒🦋</h1>
                <p><span class="pulse-dot"></span>WhatsApp Pair Session</p>
            </div>
        </div>

        <div class="card">
            <div class="card-label">Enter WhatsApp Number</div>
            <div class="input-group">
                <div class="input-prefix">+</div>
                <input type="tel" id="phoneInput" placeholder="947XXXXXXXX" autocomplete="off">
            </div>

            <button class="btn" id="submitBtn" onclick="getPairCode()">
                <div class="btn-inner" id="btnContent">GET PAIR CODE</div>
            </button>

            <div class="result" id="resultBox"></div>
        </div>

        <div class="footer">POWERED BY QUEEN HIRU MD</div>
    </div>

    <script>
        async function getPairCode() {
            const input = document.getElementById('phoneInput').value.replace(/[^0-9]/g, '');
            const btn = document.getElementById('submitBtn');
            const btnContent = document.getElementById('btnContent');
            const resultBox = document.getElementById('resultBox');

            if (!input || input.length < 9) {
                resultBox.innerHTML = `<div class="error-box">⚠️ කරුණාකර රටේ කේතය (94) සමඟ නිවැරදි අංකය ඇතුළත් කරන්න.</div>`;
                resultBox.classList.add('show');
                return;
            }

            btn.disabled = true;
            btnContent.innerHTML = `<div class="spinner"></div> GENERATING...`;
            resultBox.classList.remove('show');

            try {
                // ඔයාගේ pair.js එකේ route එක '/code' නම් මේක වැඩ කරනවා. 
                // වෙන නමක් නම් (උදා: '/pair') පහත '/code' කියන තැන මාරු කරන්න.
                const response = await fetch(`/code?number=${input}`);
                const data = await response.json();

                if (data.code) {
                    resultBox.innerHTML = `
                        <div class="code-box">
                            <div class="code-label">YOUR PAIRING CODE</div>
                            <div class="code-value" id="pairCodeText">${data.code}</div>
                            <button class="copy-btn" id="copyBtn" onclick="copyCode('${data.code}')">COPY CODE</button>
                        </div>
                        <div class="instructions">
                            <p>1. WhatsApp Open කර <span>Linked Devices</span> වෙත යන්න.<br>
                            2. <span>Link with phone number</span> තෝරා ඉහත කේතය ඇතුළත් කරන්න.</p>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || "Code ලබා ගැනීමට නොහැකි විය.");
                }
            } catch (err) {
                resultBox.innerHTML = `<div class="error-box">❌ දෝෂයකි: ${err.message || "Server එක සම්බන්ධ කරගත නොහැක."}</div>`;
            } finally {
                btn.disabled = false;
                btnContent.innerHTML = `GET PAIR CODE`;
                resultBox.classList.add('show');
            }
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code);
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "COPIED!";
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.innerText = "COPY CODE";
                copyBtn.classList.remove('copied');
            }, 2000);
        }
    </script>
</body>
</html>
